<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Miba Yeik Auto Service</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="မိဘရိပ် Auto Service — အင်ဂျင်ဝိုင်လဲ၊ ဘရိတ်၊ AC၊ ဘီးချိန်။ Online Booking၊ ကားပြင်ဆင်မှု မှတ်တမ်း၊ ဆိုင်နဲ့ Chat။">
<meta name="theme-color" content="#1d4fa3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap">
<style>
/* Layout: the garage's own site — blue sign band with the red-stroked name, rotating promo banners, a price board, a day/slot booking picker, and an account drawer with the car's service book */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#f4f6f9; --ink:#141d27; --muted:#586574; --line:#d4dbe2;
  --brand:#1d4fa3; --brand-2:#163d80; --name:#e3121b; --accent:#f0a500; --ok:#2c8a55; --bad:#c0392b; --warn:#b86e00;
  --f-body:"Noto Sans Myanmar","Padauk","Myanmar Text",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141a;--surface:#171f28;--sunk:#131a22;--ink:#e6ebf0;--muted:#97a3af;--line:#28323d;--accent:#f5b62a;--ok:#4cbf7f;--bad:#ef6a5a;--warn:#e9a03b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141a;--surface:#171f28;--sunk:#131a22;--ink:#e6ebf0;--muted:#97a3af;--line:#28323d;--accent:#f5b62a;--ok:#4cbf7f;--bad:#ef6a5a;--warn:#e9a03b;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:70px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
[hidden]{display:none!important}
a{color:inherit}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.name{display:inline-grid;justify-items:center;font-weight:700;color:var(--name);-webkit-text-stroke:3px #fff;paint-order:stroke fill;line-height:1.05}
.name .a{font-size:20px;line-height:1.45}.name .b{font-family:var(--f-num);font-size:17px;letter-spacing:.05em;text-transform:uppercase}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);border-bottom:4px solid var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--brand)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:7px}
.top nav{display:flex;gap:2px;margin-left:auto}
.top nav a{color:#fff;text-decoration:none;font-size:14px;padding:5px 9px;border-radius:6px;opacity:.88}
.top nav a:hover{background:rgba(255,255,255,.12);opacity:1}
.acct{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:620px){.top nav{display:none}.acct{margin-left:auto}}

/* banners */
.hero{background:var(--brand-2)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;min-height:260px;display:grid;align-items:end;color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 60%,#0d2a5c 100%);overflow:hidden}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.72))}
.slide .in{position:relative;z-index:1;padding:28px max(20px,env(safe-area-inset-left,0px)) 34px;max-width:900px;width:100%;margin:0 auto}
.slide h2{font-size:clamp(24px,5vw,36px);line-height:1.45;margin:0;text-wrap:balance}
.slide p{margin:4px 0 0;opacity:.88}
.slide .cta{display:inline-block;margin-top:12px;background:var(--accent);color:#141d27;font-weight:700;border-radius:8px;padding:7px 14px;font-size:14px}
.slide .ring{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(255,255,255,.06)}
.slide .ring.b{right:40px;top:90px;width:140px;height:140px;border-width:18px;border-color:rgba(240,165,0,.18)}
.sign{min-height:230px;display:grid;place-items:center;text-align:center;background:var(--brand);padding:30px 16px}
.sign .name .a{font-size:clamp(44px,12vw,72px)}.sign .name .b{font-size:clamp(32px,8vw,52px)}
.sign .name{-webkit-text-stroke:5px #fff}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 10px;background:var(--brand-2)}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.35)}
.dots button[aria-current="true"]{background:var(--accent);width:22px;border-radius:4px}

/* contact strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-1px;padding-block:14px}
.chip{display:grid;gap:0;align-content:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-decoration:none;min-width:0}
.chip small{font-size:11px;color:var(--muted)}
.chip b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.call{background:var(--accent);border-color:var(--accent);color:#141d27}.chip.call small{color:#141d27;opacity:.7}
.chip.call b{font-family:var(--f-num);font-size:19px;letter-spacing:.02em}
@media (max-width:560px){.strip{grid-template-columns:1fr 1fr}.strip .chip:first-child{grid-column:1/-1}}

main{display:grid;gap:34px;padding-block:6px 40px}
h2.h{font-size:20px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.h small{font-size:12px;color:var(--muted);font-weight:400}
.about{color:var(--muted);margin:0;max-width:65ch}
.hours{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.hours i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}

.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto auto;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item b{font-weight:500}
.item p{grid-column:1/2;margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.item .price{font-family:var(--f-num);font-size:21px;font-weight:600;white-space:nowrap}
.item .price small{font-size:13px;color:var(--muted);margin-left:2px}
.item .bk{grid-row:span 2;border:1px solid var(--line);background:var(--sunk);border-radius:7px;font-size:12px;padding:4px 9px;white-space:nowrap}

/* booking */
.bookcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.step{display:grid;gap:8px}
.lbl{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.lbl .n{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-family:var(--f-num);font-size:14px;display:grid;place-items:center}
.svcs{display:flex;flex-wrap:wrap;gap:6px}
.svcs label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;background:var(--sunk)}
.svcs input{accent-color:var(--brand)}
.svcs label:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface));font-weight:500}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 auto;width:62px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:grid;justify-items:center;line-height:1.3}
.day small{font-size:11px;color:var(--muted)}
.day b{font-family:var(--f-num);font-size:24px}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.day[aria-pressed="true"] small{color:#fff;opacity:.85}
.day:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font-family:var(--f-num);font-size:18px;font-weight:600;display:grid;line-height:1.2}
.slot small{font-family:var(--f-body);font-size:10px;font-weight:400;color:var(--muted)}
.slot[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.slot[aria-pressed="true"] small{color:#fff}
.slot:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.f input,.f textarea,.f select,.inp{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;width:100%;min-width:0;color:var(--ink)}
.plate-in{font-family:var(--f-num)!important;font-size:19px!important;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#fff!important;color:#111!important;border:2px solid #222!important}
.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:700;background:var(--sunk);border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#141d27}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;color:var(--muted)}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.done{border:2px dashed var(--ok);border-radius:12px;padding:16px;text-align:center;display:grid;gap:6px;justify-items:center}
.done .big{font-family:var(--f-num);font-size:34px;font-weight:700;color:var(--ok);line-height:1.1}

.posts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:620px){.posts{grid-template-columns:1fr}}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid}
.post img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.post .in{padding:12px 14px;display:grid;gap:4px}
.post b{font-size:16px;line-height:1.5}
.post small{color:var(--muted);font-size:12px}
.post p{margin:0;color:var(--muted);font-size:14px;white-space:pre-line}

footer{background:var(--brand);color:#fff;border-top:4px solid var(--accent)}
footer .wrap{padding-block:26px;display:grid;gap:14px;justify-items:center;text-align:center;font-size:13px}
footer .links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;opacity:.9}

/* drawer + chat */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.ph{display:flex;align-items:center;gap:10px}
.ph h3{margin:0;font-size:18px}
.ph .x{margin-left:auto;border:0;background:var(--surface);border-radius:50%;width:34px;height:34px;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.tabs button{border:0;background:var(--sunk);padding:9px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.plate{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#111;border:2px solid #222;border-radius:4px;padding:0 7px;font-family:var(--f-num);font-weight:700;font-size:18px;letter-spacing:.04em;line-height:1.5;white-space:nowrap}
.plate i{font-style:normal;font-size:11px;font-weight:600;background:#222;color:#fff;padding:0 4px;border-radius:2px}
.car{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--sunk)}
.due{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.due .big{font-family:var(--f-num);font-size:24px;font-weight:700}
.due.late .big{color:var(--bad)}
.pill{display:inline-block;font-size:12px;padding:0 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.visits{border-left:2px solid var(--line);margin-left:6px;display:grid}
.visit{position:relative;padding:0 0 12px 18px}
.visit::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.visit .w{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.visit .w b{color:var(--ink)}
.brow{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding:8px 0}
.brow:last-child{border-bottom:0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--brand);color:#fff;border:3px solid #fff;border-radius:30px;padding:10px 16px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.28);display:flex;gap:8px;align-items:center}
.fab .badge{background:var(--name);border-radius:99px;font-size:11px;padding:0 6px;font-family:var(--f-num)}
.bubbles{display:grid;gap:8px;max-height:55vh;overflow-y:auto;padding:2px}
.bub{max-width:82%;padding:7px 11px;border-radius:12px;font-size:14px;line-height:1.55}
.bub.me{justify-self:end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
.bub.them{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.bub small{display:block;font-size:10px;opacity:.7;text-align:right}
.bub img{max-width:220px;border-radius:8px;display:block}
.demo{font-family:var(--f-num);font-weight:600;font-size:11px;letter-spacing:.08em;background:var(--accent);color:#141d27;padding:0 6px;border-radius:3px}
.loading{color:var(--muted);text-align:center;padding:40px 10px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;max-width:90vw;text-align:center}

/* brand marquee */
.brands{background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden;padding-block:14px;position:relative}
.brands .lbl2{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.brands .track{display:flex;gap:14px;width:max-content;animation:marq 32s linear infinite}
.brands:hover .track{animation-play-state:paused}
.brands .logo{flex:none;width:118px;height:70px;border-radius:12px;background:#fff;border:1px solid #e2e6ea;display:flex;align-items:center;justify-content:center;overflow:hidden}
.brands .logo img{max-width:96px;max-height:48px;width:auto;height:auto;display:block}
.brands::before,.brands::after{content:"";position:absolute;top:0;bottom:0;width:40px;z-index:1;pointer-events:none}
.brands::before{left:0;background:linear-gradient(90deg,var(--surface),transparent)}
.brands::after{right:0;background:linear-gradient(270deg,var(--surface),transparent)}
@keyframes marq{to{transform:translateX(calc(-50% - 7px))}}
@media (prefers-reduced-motion:reduce){.brands .track{animation:none;flex-wrap:wrap;width:auto;justify-content:center}.brands .track .dup{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="index.html" class="name" id="hname" style="text-decoration:none"><span class="a">မိဘရိပ်</span><span class="b">Auto Service</span></a>
  <nav><a href="#services">ဈေးနှုန်း</a><a href="#booking">Booking</a><a href="#posts">သတင်း</a></nav>
  <button class="acct" id="acct" data-a="account">Login</button>
</div></header>
<div class="hero" id="hero"><div class="sign"><span class="name"><span class="a">မိဘရိပ်</span><span class="b">Auto Service</span></span></div></div>
<div class="brands"><div class="lbl2">ပြင်ပေးသော ကားအမှတ်တံဆိပ်များ</div><div class="track"><span class="logo"><img src="assets/brands/toyota.png" alt="Toyota" loading="lazy"></span><span class="logo"><img src="assets/brands/honda.png" alt="Honda" loading="lazy"></span><span class="logo"><img src="assets/brands/nissan.png" alt="Nissan" loading="lazy"></span><span class="logo"><img src="assets/brands/mazda.png" alt="Mazda" loading="lazy"></span><span class="logo"><img src="assets/brands/mitsubishi.png" alt="Mitsubishi" loading="lazy"></span><span class="logo"><img src="assets/brands/suzuki.png" alt="Suzuki" loading="lazy"></span><span class="logo"><img src="assets/brands/subaru.png" alt="Subaru" loading="lazy"></span><span class="logo"><img src="assets/brands/isuzu.png" alt="Isuzu" loading="lazy"></span><span class="logo dup" aria-hidden="true"><img src="assets/brands/toyota.png" alt="" loading="lazy"></span><span class="logo dup" aria-hidden="true"><img src="assets/brands/honda.png" alt="" loading="lazy"></span><span class="logo dup" aria-hidden="true"><img src="assets/brands/nissan.png" alt="" loading="lazy"></span><span class="logo dup" aria-hidden="true"><img src="assets/brands/mazda.png" alt="" loading="lazy"></span><span class="logo dup" aria-hidden="true"><img src="assets/brands/mitsubishi.png" alt="" loading="lazy"></span><span class="logo dup" aria-hidden="true"><img src="assets/brands/suzuki.png" alt="" loading="lazy"></span><span class="logo dup" aria-hidden="true"><img src="assets/brands/subaru.png" alt="" loading="lazy"></span><span class="logo dup" aria-hidden="true"><img src="assets/brands/isuzu.png" alt="" loading="lazy"></span></div></div>
<div id="page"><div class="loading">ဖွင့်နေသည်...</div></div>
<footer><div class="wrap" id="foot"></div></footer>
<button class="fab" id="fab" data-a="chat" hidden>💬 ဆိုင်နဲ့ Chat <span class="badge" id="fabn" hidden></span></button>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>

<script src="config.js"></script>

<script>
const CFG=window.GP_CONFIG||{};
const DEMO=!CFG.SUPABASE_URL||new URLSearchParams(location.search).has('demo');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ks=n=>Math.round(n||0).toLocaleString('en-US');
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dmy=d=>new Date(String(d).length===10?d+'T12:00:00':d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const dm=d=>new Date(String(d).length===10?d+'T12:00:00':d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const hm=d=>new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const km=n=>n?(+n).toLocaleString('en-US')+' km':'';
const WD=['တနင်္ဂနွေ','တနင်္လာ','အင်္ဂါ','ဗုဒ္ဓဟူး','ကြာသပတေး','သောကြာ','စနေ'];
const WDS=['နွေ','လာ','ဂါ','ဟူး','တေး','ကြာ','နေ'];

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.append(s)})}
function plate(p){const s=String(p||'');const i=s.indexOf(' ');return i<0?`<span class="plate">${esc(s)}</span>`:`<span class="plate"><i>${esc(s.slice(0,i))}</i>${esc(s.slice(i+1))}</span>`}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function errMsg(e){const m=(e&&e.message)||String(e);
  if(/Invalid login/i.test(m))return 'Email သို့မဟုတ် Password မှားနေပါတယ်';if(/already registered/i.test(m))return 'ဒီ Email နဲ့ အကောင့် ရှိပြီးသားပါ — Login ဝင်ပါ';
  if(/at least 6/i.test(m))return 'Password အနည်းဆုံး ၆ လုံး ထည့်ပါ';if(/Email not confirmed/i.test(m))return 'Email ထဲက confirm link ကို အရင်နှိပ်ပါ';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'အင်တာနက် ချိတ်ဆက်မှု မရှိပါ';if(/row-level security/i.test(m))return 'ခွင့်မရှိပါ';return m}
async function rpc(n,a){const {data,error}=await sb.rpc(n,a);if(error)throw error;return data}

async function boot(){
  try{
    if(DEMO){await loadScript('demo-backend.js');sb=window.GPDemo.createClient()}
    else{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}
    SITE=await rpc('site_info');
    if(!SITE){$('#page').innerHTML='<div class="loading">Website ကို ယာယီ ပိတ်ထားပါတယ်။</div>';return}
    render();
    const {data}=await sb.auth.getSession();if(data&&data.session)await onLogin(data.session.user,true);
    sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){USER=null;PROF=null;updAcct()}});
  }catch(e){$('#page').innerHTML='<div class="loading">ဖွင့်လို့ မရပါ — အင်တာနက် စစ်ပြီး ပြန်ဖွင့်ပါ။</div>'}
}

let slideT=null;
function startSlides(){const el=$('#slides');if(!el)return;clearInterval(slideT);
  const cur=()=>Math.round(el.scrollLeft/el.clientWidth);
  el.addEventListener('scroll',()=>{const i=cur();document.querySelectorAll('.dots button').forEach((b,k)=>b.setAttribute('aria-current',k===i))},{passive:true});
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)slideT=setInterval(()=>{const n=el.children.length;const i=(cur()+1)%n;el.scrollTo({left:i*el.clientWidth,behavior:'smooth'})},5500)}

/* ---------- booking ---------- */
function bookDays(){const b=SITE.booking||{};const closed=String(b.closed||'').split(',').map(x=>x.trim());const out=[];const d=new Date();
  for(let i=0;i<=(+b.days||14);i++){const x=new Date(d);x.setDate(d.getDate()+i);out.push({key:dayKey(x),d:x,closed:closed.includes(String(x.getDay()))})}return out}
const slotsOf=()=>String((SITE.booking||{}).slots||'').split(',').map(x=>x.trim()).filter(Boolean);
async function loadCounts(){const days=bookDays();try{const r=await rpc('booked_counts',{p_from:days[0].key,p_to:days[days.length-1].key});BK.counts={};(r||[]).forEach(x=>BK.counts[x.booking_date+'|'+x.time_slot]=+x.n)}catch(e){}}
function slotFree(day,slot){const cap=+(SITE.booking||{}).capacity||1;if((BK.counts[day+'|'+slot]||0)>=cap)return false;
  if(day===dayKey(new Date())){const [h,m]=slot.split(':').map(Number);const t=new Date();t.setHours(h,m,0,0);if(t-Date.now()<30*60e3)return false}return true}
async function renderBooking(done){
  const el=$('#bookcard');if(!el)return;
  if(done){el.innerHTML=`<div class="done"><span class="msg">Booking နံပါတ်</span><span class="big">#${done.no}</span><b>${WD[new Date(done.date+'T12:00:00').getDay()]} ${dmy(done.date)} · <span class="num" style="font-size:18px">${esc(done.slot)}</span></b>
    <span class="msg">ဆိုင်က ဖုန်းဆက်ပြီး အတည်ပြုပေးပါမယ်။ ${USER?'Account ထဲမှာလည်း ကြည့်လို့ရပါတယ်။':'Account ဖွင့်ထားရင် Booking အခြေအနေကို ကြည့်လို့ရပါတယ်။'}</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${USER?'<button class="btn sm" data-a="account">ကျွန်ုပ်၏ Booking</button>':'<button class="btn sm" data-a="account">Account ဖွင့်မယ်</button>'}<button class="btn sm" data-a="booknew">နောက်တစ်ခု Booking</button></div></div>`;return}
  if(!Object.keys(BK.counts).length)await loadCounts();
  const days=bookDays();if(!BK.date){const f=days.find(d=>!d.closed&&slotsOf().some(s=>slotFree(d.key,s)));BK.date=f?f.key:null}
  const v=PROF&&PROF.vehicles&&PROF.vehicles[0];
  el.innerHTML=`<div class="step"><span class="lbl"><span class="n">1</span>ဘာလုပ်ချင်လဲ</span><div class="svcs">${(SITE.services||[]).map(s=>`<label><input type="checkbox" name="svc" value="${esc(s.name)}" ${BK.svcs.has(s.name)?'checked':''}>${esc(s.name)}</label>`).join('')}<label><input type="checkbox" name="svc" value="အခြား (မှတ်ချက်တွင် ရေးမည်)" ${BK.svcs.has('အခြား (မှတ်ချက်တွင် ရေးမည်)')?'checked':''}>အခြား</label></div></div>
    <div class="step"><span class="lbl"><span class="n">2</span>ရက် ရွေးပါ</span><div class="days">${days.map(d=>`<button type="button" class="day" data-a="bday" data-v="${d.key}" aria-pressed="${BK.date===d.key}" ${d.closed?'disabled title="ပိတ်ရက်"':''}><small>${d.key===dayKey(new Date())?'ယနေ့':WDS[d.d.getDay()]}</small><b>${d.d.getDate()}</b><small>${d.d.toLocaleDateString('en-GB',{month:'short'})}</small></button>`).join('')}</div></div>
    <div class="step"><span class="lbl"><span class="n">3</span>အချိန် ရွေးပါ</span><div class="slots">${BK.date?slotsOf().map(s=>{const free=slotFree(BK.date,s);return`<button type="button" class="slot" data-a="bslot" data-v="${esc(s)}" aria-pressed="${BK.slot===s}" ${free?'':'disabled'}>${esc(s)}<small>${free?'ရနိုင်':'ပြည့်'}</small></button>`}).join(''):'<span class="msg">ရက် အရင်ရွေးပါ</span>'}</div></div>
    <form class="step" id="bookform"><span class="lbl"><span class="n">4</span>ဆက်သွယ်ရန်</span>
      <div class="two"><label class="f">အမည်<input id="bn" required value="${esc(PROF?PROF.name:'')}" autocomplete="name"></label><label class="f">ဖုန်း<input id="bp" required inputmode="tel" value="${esc(PROF?PROF.phone:'')}" placeholder="09 ..." autocomplete="tel"></label></div>
      <div class="two"><label class="f">နံပါတ်ပြား<input id="bpl" class="plate-in" value="${esc(v?v.plate:'')}" placeholder="YGN 5D-1234" autocomplete="off"></label><label class="f">ကားအမျိုးအစား<input id="bm" value="${esc(v?v.model:'')}" placeholder="Toyota Probox"></label></div>
      <label class="f">မှတ်ချက် (ပြဿနာ)<input id="bnote" placeholder="ဥပမာ ဘရိတ်နင်းရင် အသံမြည်"></label>
      <div class="msg bad" id="berr"></div>
      <button class="btn primary block" id="bgo">${BK.date&&BK.slot?`${WD[new Date(BK.date+'T12:00:00').getDay()]} ${dm(BK.date)} · ${esc(BK.slot)} — Booking တင်မယ်`:'Booking တင်မယ်'}</button></form>`;
  el.querySelectorAll('input[name="svc"]').forEach(c=>c.addEventListener('change',()=>{c.checked?BK.svcs.add(c.value):BK.svcs.delete(c.value)}));
}

let atab='login';
function sheet(html){$('#panel').innerHTML=html;$('#sheet').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow='';clearInterval(CHT);CHT=null}
const head=t=>`<div class="ph"><h3>${t}</h3><button class="x" data-a="close" aria-label="ပိတ်">×</button></div>`;
function updAcct(){$('#acct').textContent=USER?(PROF?PROF.name:'Account'):'Login';refreshBadge()}
async function onLogin(user,silent){
  USER=user;
  try{PROF=await rpc('my_profile');
    if(!PROF){const m=(user.user_metadata||{}).cust;if(m&&m.phone){await rpc('customer_register',{p_name:m.name,p_phone:m.phone,p_plate:m.plate||''});PROF=await rpc('my_profile')}}
  }catch(e){if(!silent)toast(errMsg(e))}
  updAcct();subscribeChat();
  if(PROF&&$('#bookcard')&&!$('#bookcard .done'))renderBooking();
}

  <div class="card"><h3 style="margin:0;font-size:15px">ကျွန်ုပ်၏ Booking</h3>${(p.bookings||[]).map(b=>{const [t,c]=BST[b.status]||['',''];const can=['pending','confirmed'].includes(b.status)&&b.booking_date>=dayKey(new Date());return`<div class="brow"><span><b>${dm(b.booking_date)} · <span class="num" style="font-size:16px">${esc(b.time_slot)}</span></b> <span class="pill" style="--c:${c}">${t}</span><br><span class="msg">${esc(b.services||'')}${b.plate?' · '+esc(b.plate):''}${b.shop_note?' · ဆိုင်: '+esc(b.shop_note):''}</span></span>${can?`<button class="btn sm" data-a="bcancel" data-id="${b.id}">ပယ်မယ်</button>`:''}</div>`}).join('')||'<span class="msg">Booking မရှိသေးပါ</span>'}</div>
  <div class="card"><h3 style="margin:0;font-size:15px">ပြင်ဆင်မှု မှတ်တမ်း</h3><div class="visits">${(p.jobs||[]).map(j=>`<div class="visit"><div class="w"><b>${dmy(j.date)}</b>${j.plate?`<span>${esc(j.plate)}</span>`:''}${j.km?`<span class="num" style="font-size:15px">${km(j.km)}</span>`:''}<span class="num" style="font-size:15px">${ks(j.total)} Ks</span></div><div>${(j.items||[]).map(esc).join('၊ ')}</div></div>`).join('')||'<span class="msg" style="padding-left:16px">မှတ်တမ်း မရှိသေးပါ</span>'}</div></div>
  <button class="btn block" data-a="logout">Logout</button>`);
}

/* ---------- chat ---------- */
async function chatSheet(){
  if(!USER){atab='login';return authSheet('ဆိုင်နဲ့ Chat ဖို့ Login ဝင်ပါ (သို့) Account ဖွင့်ပါ')}
  if(!PROF)return profileSheet();
  const draw=async(first)=>{
    let msgs=[];try{const {data,error}=await sb.from('chat_messages').select('*').eq('customer_id',PROF.id).order('created_at',{ascending:true}).limit(300);if(error)throw error;msgs=data||[]}catch(e){if(first)toast(errMsg(e));return}
    if($('#sheet').hidden&&!first)return;
    LASTSEEN=msgs.length;try{localStorage.setItem('mby-seen-'+PROF.id,String(msgs.filter(m=>m.sender==='shop').length))}catch(e){}refreshBadge(0);
    const html=msgs.map(m=>`<div class="bub ${m.sender==='customer'?'me':'them'}">${m.image_url?`<a href="${esc(m.image_url)}" target="_blank" rel="noopener"><img src="${esc(m.image_url)}" alt="ပုံ"></a>`:''}${esc(m.body||'')}<small>${dm(m.created_at)} ${hm(m.created_at)}</small></div>`).join('')||'<div class="msg" style="text-align:center;padding:20px">ဆိုင်ကို မေးချင်တာ ရေးပို့ပါ — ဈေးနှုန်း၊ ပစ္စည်းရှိ/မရှိ၊ ဆိုင်ဖွင့်ချိန်...</div>';
    if(first||!$('#bubbles')){sheet(`${head(`${esc(SITE.name1)} နဲ့ Chat`)}<div class="bubbles" id="bubbles">${html}</div>
      <form id="chatform" style="display:flex;gap:8px;align-items:center"><label class="btn sm" style="cursor:pointer" title="ပုံပို့">📷<input id="cimg" type="file" accept="image/*" hidden></label><input id="ctxt" class="inp" placeholder="စာရေးရန်..." autocomplete="off"><button class="btn dark sm">ပို့</button></form>`);
      $('#cimg').addEventListener('change',e=>{const f=e.target.files[0];if(f)sendImage(f).then(()=>draw()).catch(err=>toast(errMsg(err)))})}
    else $('#bubbles').innerHTML=html;
    const b=$('#bubbles');if(b)b.scrollTop=b.scrollHeight;
  };
  await draw(true);clearInterval(CHT);CHT=setInterval(()=>{if($('#sheet').hidden||!$('#bubbles')){clearInterval(CHT);return}draw()},DEMO?4000:15000);
  window.__chatDraw=draw;
}
async function shrink(file,max=1280){const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('ပုံ ဖွင့်လို့ မရပါ'));i.src=URL.createObjectURL(file)});
  const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
async function sendImage(f){if(!/^image\//.test(f.type))throw new Error('ပုံဖိုင် ရွေးပါ');const blob=await shrink(f);const path='chat/'+PROF.id+'/'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;const url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  const r=await sb.from('chat_messages').insert({shop_id:await shopId(),customer_id:PROF.id,sender:'customer',image_url:url});if(r.error)throw r.error}
let SHOPID=null;
async function shopId(){if(SHOPID)return SHOPID;const {data}=await sb.from('customers').select('shop_id').eq('id',PROF.id).maybeSingle();SHOPID=data&&data.shop_id;return SHOPID}
async function refreshBadge(force){
  const n=$('#fabn');if(!USER||!PROF){n.hidden=true;return}
  if(force===0){n.hidden=true;return}
  try{const {data}=await sb.from('chat_messages').select('id,sender').eq('customer_id',PROF.id);const shopN=(data||[]).filter(m=>m.sender==='shop').length;let seen=0;try{seen=+localStorage.getItem('mby-seen-'+PROF.id)||0}catch(e){}
    const u=Math.max(0,shopN-seen);n.textContent=u;n.hidden=!u}catch(e){}
}
function subscribeChat(){
  if(!PROF||DEMO||!sb.channel)return;if(CH)sb.removeChannel(CH);
  CH=sb.channel('cust-'+PROF.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'customer_id=eq.'+PROF.id},()=>{if(!$('#sheet').hidden&&$('#bubbles')&&window.__chatDraw)window.__chatDraw();else{refreshBadge();toast(SITE.name1+' က စာပြန်ထားပါတယ်')}}).subscribe();
}

/* ---------- events ---------- */
const dblc=(t,l)=>{if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent=l;return false}return true};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  const A={
    close:closeSheet,account:()=>profileSheet(),chat:()=>chatSheet(),
    atab:()=>{atab=t.dataset.k;authSheet()},
    demologin:async()=>{const {data,error}=await sb.auth.signInWithPassword({email:GPDemo.customer.email,password:'demo'});if(error)return authSheet(esc(errMsg(error)));await onLogin(data.user);profileSheet()},
    logout:async()=>{if(CH)sb.removeChannel(CH);CH=null;await sb.auth.signOut();USER=null;PROF=null;updAcct();closeSheet();renderBooking();toast('Logout ပြီးပါပြီ')},
    dot:()=>{const el=$('#slides');el.scrollTo({left:+t.dataset.i*el.clientWidth,behavior:'smooth'})},
    pick:()=>{BK.svcs.add(t.dataset.v);renderBooking();document.getElementById('booking').scrollIntoView()},
    bday:()=>{BK.date=t.dataset.v;if(BK.slot&&!slotFree(BK.date,BK.slot))BK.slot=null;renderBooking()},
    bslot:()=>{BK.slot=t.dataset.v;renderBooking()},
    booknew:()=>{BK.slot=null;BK.svcs.clear();renderBooking()},
    bcancel:async()=>{if(!dblc(t,'သေချာ?'))return;try{await rpc('cancel_my_booking',{p_id:t.dataset.id});PROF=await rpc('my_profile');BK.counts={};profileSheet();toast('Booking ပယ်ပြီးပါပြီ')}catch(err){toast(errMsg(err))}}};
  if(A[a])A[a]();
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,v=id=>($(id)?.value||'').trim();
  const btn=f.querySelector('button:not([type="button"])');if(btn)btn.disabled=true;
  try{
    if(f.id==='bookform'){
      const err=m=>{$('#berr').textContent=m};
      if(!BK.svcs.size)return err('ဘာလုပ်ချင်လဲ အနည်းဆုံး တစ်ခု ရွေးပါ');if(!BK.date||!BK.slot)return err('ရက်နဲ့ အချိန် ရွေးပါ');
      try{const r=await rpc('create_booking',{p_name:v('#bn'),p_phone:v('#bp'),p_plate:v('#bpl'),p_model:v('#bm'),p_services:[...BK.svcs].join(', '),p_date:BK.date,p_slot:BK.slot,p_note:v('#bnote')});
        BK.counts={};BK.svcs.clear();BK.slot=null;if(USER)PROF=await rpc('my_profile');renderBooking(r);document.getElementById('booking').scrollIntoView()}
      catch(x){err(errMsg(x));BK.counts={};await loadCounts()}
    }
    if(f.id==='loginform'){const {data,error}=await sb.auth.signInWithPassword({email:v('#le'),password:$('#lp').value});if(error)return authSheet(esc(errMsg(error)));await onLogin(data.user);profileSheet()}
    if(f.id==='signform'){
      const cust={name:v('#sn'),phone:v('#sph'),plate:v('#spl')};
      const {data,error}=await sb.auth.signUp({email:v('#se'),password:$('#sp').value,options:{data:{cust},emailRedirectTo:location.href.split('#')[0]}});
      if(error)return authSheet(esc(errMsg(error)));
      if(data.session){await onLogin(data.user||data.session.user);profileSheet();toast('Account ဖွင့်ပြီးပါပြီ')}else{atab='login';authSheet(esc(v('#se'))+' ထဲက confirm link ကို နှိပ်ပြီး Login ဝင်ပါ','ok')}
    }
    if(f.id==='regform'){await rpc('customer_register',{p_name:v('#rn'),p_phone:v('#rph'),p_plate:v('#rpl')});PROF=await rpc('my_profile');updAcct();profileSheet()}
    if(f.id==='chatform'){const body=v('#ctxt');if(!body)return;const r=await sb.from('chat_messages').insert({shop_id:await shopId(),customer_id:PROF.id,sender:'customer',body});if(r.error)throw r.error;$('#ctxt').value='';if(window.__chatDraw)await window.__chatDraw()}
  }catch(x){toast(errMsg(x))}finally{if(btn&&btn.isConnected)btn.disabled=false}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
boot().then(()=>{ /* landing page deep links: app.html#booking / #services / #account / #chat */
  const h=location.hash.slice(1);if(!h)return;
  if(h==='account'){$('#acct')&&$('#acct').click();return}
  if(h==='chat'){const f=$('#fab');(f&&!f.hidden?f:$('#acct'))&&(f&&!f.hidden?f:$('#acct')).click();return}
  const el=document.getElementById(h);el&&el.scrollIntoView({behavior:'smooth'});
});
</script>
