<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Miba Yeik Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d4fa3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap">
<style>

/* Layout: workshop floor app — blue shop bar, job tickets with plate tags, bottom tab nav, slide-up sheets; money in Ks with lakh (သိန်း) scale on charts */
:root{
  --bg:#eceff1; --surface:#ffffff; --sunk:#f5f7f8; --ink:#1b232b; --muted:#5b6772; --line:#d3d9de;
  --accent:#f0a500; --accent-ink:#1b232b; --steel:#2e4a5f;
  --ok:#2c8a55; --warn:#b86e00; --bad:#bf3a2b; --info:#2f6ea8;
  --plate-bg:#ffffff; --plate-ink:#111;
  --hdr-bg:#1d4fa3; --hdr-name:#e3121b; --hdr-stroke:#ffffff;
  --bar:#2f6ea8; --bar2:#f0a500; --grid:#dde3e8;
  --f-body:"Noto Sans Myanmar","Padauk","Myanmar Text",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --sunk:#151b21; --ink:#e5e9ed; --muted:#93a0ab; --line:#2b3540;
  --accent:#f5b62a; --accent-ink:#11161b; --steel:#8fb4cf;
  --ok:#4cbf7f; --warn:#e9a03b; --bad:#ef6a5a; --info:#6aa7de;
  --plate-bg:#e9ecef; --plate-ink:#111; --bar:#6aa7de; --bar2:#f5b62a; --grid:#26303a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --sunk:#151b21; --ink:#e5e9ed; --muted:#93a0ab; --line:#2b3540;
  --accent:#f5b62a; --accent-ink:#11161b; --steel:#8fb4cf;
  --ok:#4cbf7f; --warn:#e9a03b; --bad:#ef6a5a; --info:#6aa7de;
  --plate-bg:#e9ecef; --plate-ink:#111; --bar:#6aa7de; --bar2:#f5b62a; --grid:#26303a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr-bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr-bg);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--accent)}
.shop{display:inline-grid;justify-items:center;line-height:1.05;font-weight:700;color:var(--hdr-name);-webkit-text-stroke:3px var(--hdr-stroke);paint-order:stroke fill}
.shop .l1{font-size:21px;line-height:1.45}
.shop .l2{font-family:var(--f-num);font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.hright{margin-left:auto;display:grid;justify-items:end;gap:3px;min-width:0}
.who{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.hright small{font-size:11px;color:#fff;opacity:.85;display:flex;gap:6px;align-items:center}
.demo{font-family:var(--f-num);font-weight:600;font-size:11px;letter-spacing:.08em;background:var(--accent);color:#1b232b;padding:0 6px;border-radius:3px}

main{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:grid;gap:18px}
h2{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .count{font-family:var(--f-num);font-size:15px;color:var(--muted);font-weight:600}
h3{font-size:14px;margin:0}
.sec{display:grid;gap:10px;min-width:0}
.hint{font-size:12px;color:var(--muted);font-weight:400}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:24px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted)}
.stat em{font-style:normal;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.stat.money{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat.money span,.stat.money em{color:var(--accent-ink);opacity:.75}
.stat.alert b{color:var(--bad)} .stat.good b{color:var(--ok)}

.plate{display:inline-flex;align-items:center;gap:6px;background:var(--plate-bg);color:var(--plate-ink);border:2px solid #222;border-radius:4px;
  padding:0 7px;font-family:var(--f-num);font-weight:700;font-size:18px;letter-spacing:.04em;line-height:1.5;white-space:nowrap}
.plate i{font-style:normal;font-size:11px;font-weight:600;background:#222;color:#fff;padding:0 4px;border-radius:2px;letter-spacing:.06em}
.plate.sm{font-size:15px;border-width:1.5px;padding:0 5px}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%;border-left:5px solid var(--st,var(--line))}
.ticket:hover{border-color:var(--muted);border-left-color:var(--st)}
.ticket .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px}
.ticket .amt{font-family:var(--f-num);font-size:18px;font-weight:600;text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--st) 16%,transparent);color:var(--st);white-space:nowrap}
.s-waiting{--st:var(--info)} .s-working{--st:var(--warn)} .s-done{--st:var(--ok)} .s-paid{--st:var(--muted)} .s-bad{--st:var(--bad)} .s-ok{--st:var(--ok)} .s-warn{--st:var(--warn)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
button.row:hover{border-color:var(--muted)}
.row .grow{flex:1;min-width:0}
.row .sub{color:var(--muted);font-size:12px}
.row .right{text-align:right;white-space:nowrap}
.bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.bar>span{display:block;height:100%;background:var(--ok)}
.bar.low>span{background:var(--warn)} .bar.out>span{background:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}
.dot.low{background:var(--warn)} .dot.out{background:var(--bad)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:5px;flex:none;background:var(--surface)}
.stepper button{border:0;background:none;width:30px;height:30px;font-size:17px}
.stepper b{min-width:28px;text-align:center;font-family:var(--f-num);font-size:17px}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:6px;font-size:13px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:2px;border-top:3px solid transparent;min-width:0}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent);font-weight:700}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-ink);
  border:0;border-radius:28px;padding:12px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;gap:6px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;padding:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.link{border:0;background:none;color:var(--bad);font-size:13px;padding:4px}
.tlink{border:0;background:none;color:var(--info);font-size:13px;padding:0;text-decoration:underline}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:660px;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head .x{margin-left:auto;border:0;background:var(--surface);border-radius:50%;width:34px;height:34px;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.flow button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 4px;font-size:13px}
.flow button[aria-pressed="true"]{background:var(--st);border-color:var(--st);color:#fff;font-weight:700}
.line{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.line .grow{flex:1;min-width:0}
.tag{font-size:11px;padding:0 6px;border-radius:3px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.addgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow-y:auto}
.add{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 10px;font-size:13px;text-align:left;line-height:1.35}
.add small{display:block;color:var(--muted);font-family:var(--f-num);font-size:14px}
.add.fav{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.add:disabled{opacity:.4}
.sumrow{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.sumrow span:last-child{font-family:var(--f-num);font-size:16px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;gap:10px}
.total b{font-family:var(--f-num);font-size:30px}
.change{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px;border-radius:6px;background:var(--sunk);font-size:13px}
.change b{font-family:var(--f-num);font-size:22px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.search,.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 11px;color:var(--ink);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-size:13px}
.seg button[aria-pressed="true"]{border:2px solid var(--ink);font-weight:700;padding:6px 9px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:grid;gap:2px}
.tile:hover{border-color:var(--muted)}
.tile b{font-size:14px} .tile span{font-size:12px;color:var(--muted);line-height:1.45}
.lock{font-size:11px;font-family:var(--f-num);letter-spacing:.06em;color:var(--bad);border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:4px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px;background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 8px 4px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:19px}
.hbar{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hbar .tr{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbar .tr span{display:block;height:100%;background:var(--bar)}
.hbar .v{font-family:var(--f-num);font-size:15px;text-align:right}

.receipt{background:#fffdf7;color:#1b1b1b;border-radius:4px;padding:18px 16px;font-size:13px;display:grid;gap:7px;
  -webkit-mask:radial-gradient(circle 6px at 50% 0,transparent 98%,#000) 0 0/16px 51% repeat-x,radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 100%/16px 51% repeat-x}
.receipt .rname{display:grid;justify-items:center;font-weight:700;color:#d0101a;line-height:1.1}
.receipt .rname .l1{font-size:20px;line-height:1.5}
.receipt .rname .l2{font-family:var(--f-num);font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.receipt .c{text-align:center;color:#555;font-size:12px}
.receipt hr{border:0;border-top:1px dashed #999;margin:2px 0;width:100%}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .r span:last-child{font-family:var(--f-num);font-size:15px;white-space:nowrap}
.receipt .big span:last-child{font-size:24px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;max-width:90vw;text-align:center}
@media (max-width:440px){.two,.three{grid-template-columns:1fr}.stat b{font-size:21px}}

/* base reset (own site) */
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---- app additions ---- */
header{--hdr-bg:var(--brand-bg,#1d4fa3)}
header .shop{color:var(--brand-fg,#e3121b)}
body::before{background:var(--brand-bg,#1d4fa3)}
.topbusy{position:fixed;left:0;right:0;top:0;height:3px;z-index:40;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){.topbusy{animation:none;background:var(--accent)}}
.gate{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px;background:
  linear-gradient(180deg,var(--steel-bg) 0 210px,var(--bg) 210px)}
.gcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 20px;display:grid;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.gbrand{display:flex;align-items:center;gap:10px;color:#fff;justify-content:center;margin-bottom:6px}
.gbrand .mark{font-family:var(--f-num);font-weight:700;font-size:15px;letter-spacing:.06em;background:#fff;color:#111;border:2px solid #111;border-radius:4px;padding:0 6px;line-height:1.5}
.gbrand b{font-family:var(--f-num);font-size:30px;letter-spacing:.04em;font-weight:700}
.gtabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gtabs button{border:0;background:var(--sunk);padding:9px;font-weight:500;color:var(--muted)}
.gtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.gmsg{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--sunk)}
.gmsg.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.gmsg.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.acct{display:grid;gap:6px}
.acct button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
.acct button small{color:var(--muted);font-size:12px}
.loading{color:var(--muted);text-align:center;padding:40px 10px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));font-size:13px;text-align:left;width:100%}
.banner b{display:block}
.banner.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.paybox{display:grid;gap:4px;padding:12px;border-radius:8px;border:1px dashed var(--line);background:var(--sunk)}
.paybox .big{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:.02em}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow code{font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:4px 8px;overflow-wrap:anywhere;min-width:0}
.swatch{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);padding:0}
:root{--steel-bg:#1d4fa3}

@media print{body>*{display:none!important}body>#sheet{display:block!important;position:static;background:none}#sheet .panel{max-height:none;overflow:visible;background:#fff;padding:0}#sheet .panel>*{display:none!important}#sheet .panel>#rcpt{display:grid!important;-webkit-mask:none;mask:none}}

.gname{display:grid;justify-items:center;color:#e3121b;-webkit-text-stroke:4px #fff;paint-order:stroke fill;font-weight:700;line-height:1.05}
.gname .a{font-size:36px;line-height:1.5}.gname .b{font-family:var(--f-num);font-size:26px;letter-spacing:.05em;text-transform:uppercase}

</style>
</head>
<body>
<div id="busy" class="topbusy" hidden></div>
<div id="gate" hidden></div>
<div id="appshell" hidden>
<header id="hdr">
  <div class="shop" id="shopname"><span class="l1"></span><span class="l2"></span></div>
  <div class="hright"><button class="who" data-a="account" id="who"></button><small><span class="demo" id="badge" hidden>DEMO</span><span id="today"></span></small></div>
</header>
<main id="view"></main>

<script src="config.js"></script>
<script>
/* =====================================================================
   မိဘရိပ် Auto Service — Admin
   Supabase (config.js) နှင့် ချိတ်ပြီး အလုပ်လုပ်သည်။ config မရှိရင် Demo mode။
   ===================================================================== */
const CFG=window.GP_CONFIG||{};
const PRODUCT=(CFG.SHOP_NAME1||'မိဘရိပ်')+' Admin';
const QS=new URLSearchParams(location.search);
const DEMO=!CFG.SUPABASE_URL||QS.has('demo');
const SUPABASE_JS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ks=n=>Math.round(n||0).toLocaleString('en-US')+' Ks';
const lakh=n=>{const v=(n||0)/100000,a=Math.abs(v);return (+(a>=100?v.toFixed(0):a>=10?v.toFixed(1):v.toFixed(2))).toString()+' သိန်း'};
const hm=d=>new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dmy=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const dm=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const sameDay=(a,b)=>dayKey(a)===dayKey(b);
const km=n=>n?(+n).toLocaleString('en-US')+' km':'—';
const plateKey=p=>String(p||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const daysTo=d=>Math.ceil((new Date(d+'T23:59:59')-Date.now())/864e5);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const PAYM=['Cash','KBZPay','WavePay','AYA Pay'];
const OPEN=['waiting','working','done'];
const ST={waiting:'စောင့်ဆိုင်း',working:'ပြင်နေ',done:'ပြီးပြီ',paid:'ငွေရှင်းပြီး',cancelled:'ပယ်ဖျက်'};
const ROLES={
  owner:{n:'Owner',d:'အပြည့်အစုံ — အမြတ်စာရင်း၊ Backup၊ ဝန်ထမ်း၊ ဆိုင်အချက်အလက်'},
  manager:{n:'Manager',d:'အမြတ်စာရင်း၊ Backup၊ ဝန်ထမ်းမှလွဲ၍ အားလုံး'},
  staff:{n:'Staff',d:'Job၊ ငွေရှင်း၊ ပစ္စည်း၊ ဖောက်သည်၊ ငွေစာရင်းပိတ်'},
  mechanic:{n:'မက္ကင်းနစ်',d:'Job ကြည့်၊ ပြင်ဆင်မှု/ပစ္စည်းထည့်၊ အခြေအနေပြောင်း — ငွေမမြင်ရ'}};
const PERM={owner:'*',manager:['checkout','money','stockEdit','customers','reports','closing','promo','logs','settings'],staff:['checkout','money','stockEdit','customers','closing'],mechanic:[]};
const EXCAT=['ဆိုင်ခ','လစာ','မီး/ရေ','ပစ္စည်းသယ်ခ','အခြား'];

/* ---------- state ---------- */
let sb=null,USER=null,SHOPS=[],CUR=null,SHOP=null,ROLE=null,ME=null,isPA=false,MODE='app',BUSY=false,CH=null;
let S=emptyState();
function emptyState(){return{shop:{},staff:[],services:[],categories:[],parts:[],customers:[],vehicles:[],jobs:[],promos:[],topups:[],expenses:[],lc:{},due:[],cstats:null,logs:null,closing:null,pa:null}}
const DRAFT={};
const can=p=>{const r=PERM[ROLE];return r==='*'||(r||[]).includes(p)};
const me=()=>S.staff.find(s=>s.id===ME)||{name:USER?.email||'',role:ROLE};
const staffName=id=>(S.staff.find(s=>s.id===id)||{}).name||'—';
const cust=id=>S.customers.find(c=>c.id===id)||{name:'Walk-in',phone:'',balance:0};
const veh=id=>S.vehicles.find(v=>v.id===id);
const plateOf=j=>j.vehicle_id?(veh(j.vehicle_id)||{}).plate||'—':'WALK-IN';
const modelOf=j=>j.vehicle_id?(veh(j.vehicle_id)||{}).model||'':'ပစ္စည်းသက်သက်';
const jl=j=>'J-'+j.no;
const job=id=>S.jobs.find(j=>j.id===id);
const part=id=>S.parts.find(p=>p.id===id);
const catName=id=>(S.categories.find(c=>c.id===id)||{}).name||'အထွေထွေ';
const stockState=p=>p.stock<=0?'out':p.stock<=p.min?'low':'ok';
const lowParts=()=>S.parts.filter(p=>p.active&&p.stock<=p.min);
const paidJobs=()=>S.jobs.filter(j=>j.status==='paid');
const oilIds=()=>new Set(S.services.filter(s=>s.oil).map(s=>s.id));
function payTotals(list){const o={};list.forEach(j=>(j.pays||[]).forEach(p=>o[p.m]=(o[p.m]||0)+p.amt));return o}

/* ---------- data layer ---------- */
function errMsg(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/row-level security|permission denied/i.test(m))return 'ဒီလုပ်ဆောင်ချက်အတွက် ခွင့်မရှိပါ';
  if(/duplicate key/i.test(m))return 'ရှိပြီးသား ဖြစ်နေပါတယ်';
  if(/Invalid login/i.test(m))return 'Email သို့မဟုတ် Password မှားနေပါတယ်';
  if(/already registered/i.test(m))return 'ဒီ Email နဲ့ အကောင့် ရှိပြီးသားပါ — Login ဝင်ပါ';
  if(/at least 6/i.test(m))return 'Password အနည်းဆုံး ၆ လုံး ထည့်ပါ';
  if(/Email not confirmed/i.test(m))return 'Email ထဲက confirm link ကို အရင်နှိပ်ပါ';
  if(/invalid format|validate email/i.test(m))return 'Email ပုံစံ မမှန်ပါ';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'အင်တာနက် ချိတ်ဆက်မှု မရှိပါ — ပြန်စမ်းပါ';
  if(/stock_check/i.test(m))return 'Stock မလုံလောက်ပါ';
  return m}
async function q(p){const {data,error}=await p;if(error)throw error;return data}
async function rpc(n,a){const {data,error}=await sb.rpc(n,a);if(error)throw error;return data}
async function all(table,{cols='*',f=null,order='id'}={}){
  let out=[],from=0;
  for(;;){let x=sb.from(table).select(cols);x=f?f(x):x.eq('shop_id',SHOP);
    const d=await q(x.order(order).range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}
  return out}
function logAct(msg){if(!SHOP)return;sb.from('activity_logs').insert({shop_id:SHOP,by_staff:ME,message:msg}).then(()=>{},()=>{});S.logs=null}
const JSEL='*,job_lines(*),job_payments(*)';
function loadStart(){const n=new Date();const a=new Date(n.getFullYear(),0,1),b=new Date(n.getFullYear(),n.getMonth()-1,1);return(a<b?a:b)}

const mapStaff=r=>({id:r.id,name:r.name,role:r.role,phone:r.phone||'',email:r.email||'',user_id:r.user_id,active:r.active!==false});
const mapSvc=r=>({id:r.id,name:r.name,price:r.price,fav:!!r.fav,oil:!!r.is_oil_change,public:r.public!==false,active:r.active!==false,sort:r.sort||0,description:r.description||''});
const mapCust=r=>({id:r.id,name:r.name,phone:r.phone||'',balance:r.balance||0,user_id:r.user_id||null});
const mapVeh=r=>({id:r.id,plate:r.plate,model:r.model||'',custId:r.customer_id,km:r.last_km});
const mapPromo=r=>({id:r.id,code:r.code,type:r.kind,val:r.value,start:r.starts_at,end:r.ends_at,uses:r.uses||0,active:r.active!==false});
let COSTS={};
const mapPart=r=>({id:r.id,name:r.name,category_id:r.category_id,cat:catName(r.category_id),price:r.price,stock:r.stock,min:r.min_stock,fav:!!r.fav,active:r.active!==false,cost:COSTS[r.id]});
function mapJob(r){return{id:r.id,no:r.job_no,vehicle_id:r.vehicle_id,custId:r.customer_id,km:r.km,note:r.note||'',status:r.status,in:r.created_at,mech:r.mechanic_id||'',
  paidAt:r.paid_at,sub:r.subtotal,discAmt:r.discount_amt||0,promo:r.promo_code||'',promoAmt:r.promo_amt||0,total:r.total,given:r.cash_given,change:r.change_amt,cashier:r.cashier_id,
  lines:(r.job_lines||[]).slice().sort((a,b)=>a.id-b.id).map(l=>({id:l.id,type:l.kind,ref:l.service_id||l.part_id,name:l.name,price:l.price,qty:l.qty})),
  pays:(r.job_payments||[]).map(p=>({m:p.method,amt:p.amount}))}}

async function loadCore(){
  const isCostRole=['owner','manager'].includes(ROLE);
  const [shop,staff,services,cats,custs,vehs,promos,costs]=await Promise.all([
    q(sb.from('shops').select('*').eq('id',SHOP).single()),all('shop_staff'),all('services'),all('categories'),all('customers'),all('vehicles'),all('promo_codes'),
    isCostRole?all('part_costs',{order:'part_id'}):Promise.resolve([])]);
  S.shop=shop;S.staff=staff.map(mapStaff);S.services=services.map(mapSvc).sort((a,b)=>a.sort-b.sort);S.categories=cats.map(c=>({id:c.id,name:c.name}));
  S.customers=custs.map(mapCust);S.vehicles=vehs.map(mapVeh);S.promos=promos.map(mapPromo).sort((a,b)=>(b.start||'')<(a.start||'')?-1:1);
  COSTS={};costs.forEach(c=>COSTS[c.part_id]=c.cost);
  await reloadParts(true);
}
async function reloadParts(skipCosts){
  if(!skipCosts&&['owner','manager'].includes(ROLE)){COSTS={};(await all('part_costs',{order:'part_id'})).forEach(c=>COSTS[c.part_id]=c.cost)}
  S.parts=(await all('parts')).map(mapPart).filter(p=>p.active).sort((a,b)=>a.name.localeCompare(b.name));
}
async function loadJobs(){
  const ls=loadStart().toISOString();
  const [open,paid,tops,exps,lcs]=await Promise.all([
    all('jobs',{cols:JSEL,f:x=>x.eq('shop_id',SHOP).in('status',OPEN)}),
    all('jobs',{cols:JSEL,f:x=>x.eq('shop_id',SHOP).eq('status','paid').gte('paid_at',ls)}),
    can('money')?all('topups',{f:x=>x.eq('shop_id',SHOP).gte('created_at',ls)}):[],
    ROLE==='owner'?all('expenses',{f:x=>x.eq('shop_id',SHOP).gte('spent_on',dayKey(ls))}):[],
    ROLE==='owner'?all('job_line_costs',{order:'line_id',f:x=>x.eq('shop_id',SHOP).gte('created_at',ls)}):[]]);
  S.jobs=open.concat(paid).map(mapJob);
  S.topups=tops.map(t=>({t:t.created_at,custId:t.customer_id,amt:t.amount,m:t.method}));
  S.expenses=exps.map(e=>({id:e.id,date:e.spent_on,cat:e.category,amt:e.amount,note:e.note||''}));
  S.lc={};lcs.forEach(c=>S.lc[c.line_id]=c.cost);
}
async function loadDue(){S.due=can('customers')?(await rpc('oil_due',{p_shop:SHOP,p_within_days:14})||[]):[]}
async function reloadJob(id){
  const r=await q(sb.from('jobs').select(JSEL).eq('id',id).maybeSingle());
  S.jobs=S.jobs.filter(j=>j.id!==id);if(r&&r.status!=='cancelled')S.jobs.unshift(mapJob(r));
  if(r&&r.status==='paid'&&ROLE==='owner'){const ids=(r.job_lines||[]).map(l=>l.id);if(ids.length)(await all('job_line_costs',{order:'line_id',f:x=>x.eq('shop_id',SHOP).in('line_id',ids)})).forEach(c=>S.lc[c.line_id]=c.cost)}
  return job(id)}
async function reloadCustomer(id){const r=await q(sb.from('customers').select('*').eq('id',id).maybeSingle());if(r){const i=S.customers.findIndex(c=>c.id===id);if(i>=0)S.customers[i]=mapCust(r);else S.customers.push(mapCust(r))}}
let liveT=null;
function onRemote(){clearTimeout(liveT);liveT=setTimeout(async()=>{try{
  const t0=new Date();t0.setHours(0,0,0,0);
  const [open,today]=await Promise.all([all('jobs',{cols:JSEL,f:x=>x.eq('shop_id',SHOP).in('status',OPEN)}),all('jobs',{cols:JSEL,f:x=>x.eq('shop_id',SHOP).eq('status','paid').gte('paid_at',t0.toISOString())})]);
  const fresh=open.concat(today),ids=new Set(fresh.map(r=>r.id));
  S.jobs=S.jobs.filter(j=>j.status==='paid'&&!ids.has(j.id)).concat(fresh.map(mapJob));
  await reloadParts(true);
  const before=(S.bookings||[]).filter(b=>b.status==='pending').length,u0=unread();
  if(ROLE!=='mechanic')await loadBookings();await loadThreads();
  if((S.bookings||[]).filter(b=>b.status==='pending').length>before)toast('Booking အသစ် ရောက်လာပါပြီ');else if(unread()>u0)toast('Message အသစ် ရောက်လာပါပြီ');
  if($('#sheet').hidden)render();
}catch(e){}},900)}
function subscribe(){
  if(DEMO||!sb.channel)return;
  if(CH)sb.removeChannel(CH);
  const f={filter:'shop_id=eq.'+SHOP,schema:'public'};
  CH=sb.channel('gp-'+SHOP).on('postgres_changes',{event:'*',table:'jobs',...f},onRemote).on('postgres_changes',{event:'*',table:'job_lines',...f},onRemote).on('postgres_changes',{event:'*',table:'parts',...f},onRemote).on('postgres_changes',{event:'*',table:'bookings',...f},onRemote).on('postgres_changes',{event:'*',table:'chat_messages',...f},onRemote).subscribe();
}

/* ---------- boot & auth ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.append(s)})}
async function boot(){
  $('#today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  try{
    if(DEMO){if(!window.GPDemo)await loadScript('demo-backend.js');sb=window.GPDemo.createClient()}
    else{await loadScript(SUPABASE_JS);sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}
  }catch(e){gate(`<div class="gmsg bad">App ဖွင့်လို့ မရပါ — အင်တာနက် စစ်ပြီး Page ကို Refresh လုပ်ပါ။</div>`);return}
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&USER){USER=null;showLogin()}if(ev==='PASSWORD_RECOVERY')setTimeout(()=>{if(USER){accountSheet();toast('Password အသစ် ထည့်ပြီး ပြောင်းပါ')}},1200)});
  const {data}=await sb.auth.getSession();
  if(data&&data.session)await afterLogin(data.session.user);else showLogin();
}
function gate(inner){
  $('#appshell').hidden=true;$('#gate').hidden=false;
  $('#gate').innerHTML=`<div class="gate"><div style="width:100%;max-width:420px;display:grid;gap:12px">
    <div class="gbrand"><span class="gname"><span class="a">${esc(CFG.SHOP_NAME1||'မိဘရိပ်')}</span><span class="b">${esc(CFG.SHOP_NAME2||'Auto Service')}</span></span></div><div class="gcard">${inner}</div>
    <div class="hint" style="text-align:center"><a href="index.html" style="color:var(--muted)">ဖောက်သည် Website သို့</a>${DEMO?' · <span class="demo">DEMO</span>':''}</div></div></div>`;
}
let authTab=QS.has('signup')||location.hash==='#signup'?'signup':'login',signKind='staff';
function showLogin(msg,kind){
  MODE='app';SHOP=null;S=emptyState();
  const demoBox=DEMO?`<div class="hint">Demo — အကောင့်တစ်ခု နှိပ်ပြီး ဝင်ကြည့်ပါ (Password မလို)</div>
    <div class="acct">${window.GPDemo.accounts.map(a=>`<button data-a="demologin" data-v="${a.email}"><span><b>${esc(a.name)}</b><br><small>${esc(a.email)}</small></span><span class="tag">${esc(a.role)}</span></button>`).join('')}</div>
    <button class="tlink" data-a="demoreset" style="justify-self:center">Demo data ပြန်စရန်</button><hr style="border:0;border-top:1px solid var(--line);width:100%">`:'';
  gate(`${demoBox}<div class="gtabs"><button data-a="atab" data-k="login" aria-pressed="${authTab==='login'}">Login</button><button data-a="atab" data-k="signup" aria-pressed="${authTab==='signup'}">အကောင့်ဖွင့်</button></div>
    ${msg?`<div class="gmsg ${kind||'bad'}">${msg}</div>`:''}
    ${authTab==='login'?`<form id="loginform" class="list" style="gap:10px">
      <label class="f">Email<input id="le" type="email" required autocomplete="username" value="${esc(store.get('gp-last-email')||'')}"></label>
      <label class="f">Password<input id="lp" type="password" required autocomplete="current-password"></label>
      <button class="btn primary block">Login ဝင်မယ်</button>
      <button type="button" class="tlink" data-a="forgot" style="justify-self:center">Password မေ့နေပါသလား?</button></form>`:
    `<div class="seg" role="group"><button data-a="skind" data-k="staff" aria-pressed="${signKind==='staff'}">ဝန်ထမ်း</button><button data-a="skind" data-k="shop" aria-pressed="${signKind==='shop'}">ဆိုင်ပိုင်ရှင် (ပထမဆုံးအကြိမ်)</button></div>
    <form id="signupform" class="list" style="gap:10px">
      ${signKind==='shop'?`<div class="two"><label class="f">ဆိုင်နာမည်<input id="sn1" required value="${esc(CFG.SHOP_NAME1||'မိဘရိပ်')}"></label><label class="f">အောက်စာကြောင်း<input id="sn2" placeholder="Auto Service" value="Auto Service"></label></div>
      <div class="two"><label class="f">ပိုင်ရှင်အမည်<input id="son" required></label><label class="f">ဖုန်း<input id="sph" inputmode="tel" required placeholder="09 ..."></label></div>
      <div class="hint">ဆိုင်ကို ပထမဆုံး Setup လုပ်ချိန် တစ်ကြိမ်သာ လုပ်ရပါမယ်။</div>`:
      `<div class="hint">ဆိုင်ပိုင်ရှင်က “ဝန်ထမ်း” စာမျက်နှာမှာ ထည့်ထားတဲ့ Email နဲ့ အကောင့်ဖွင့်ပါ။ ဝင်တာနဲ့ ဆိုင်ကို အလိုအလျောက် ချိတ်ပေးပါမယ်။</div>`}
      <label class="f">Email<input id="se" type="email" required autocomplete="username"></label>
      <label class="f">Password (အနည်းဆုံး ၆ လုံး)<input id="sp" type="password" required minlength="6" autocomplete="new-password"></label>
      <button class="btn primary block">${signKind==='shop'?'ဆိုင်အကောင့် ဖွင့်မယ်':'အကောင့်ဖွင့်မယ်'}</button></form>`}`);
}
async function afterLogin(user){
  USER=user;busy(true);
  try{
    try{await rpc('claim_staff_invite')}catch(e){}
    try{isPA=!!(await q(sb.from('platform_admins').select('user_id').eq('user_id',user.id).maybeSingle()))}catch(e){isPA=false}
    SHOPS=await rpc('my_shops')||[];
    const pend=user.user_metadata&&user.user_metadata.pending_shop;
    if(!SHOPS.length&&pend&&!store.get('gp-created-'+user.id)){
      await rpc('create_shop',{p_name1:pend.name1,p_name2:pend.name2,p_owner_name:pend.owner,p_phone:pend.phone});store.set('gp-created-'+user.id,'1');
      SHOPS=await rpc('my_shops')||[];
    }
    if(!SHOPS.length){busy(false);if(isPA){MODE='pa';enterApp();return}return noShop()}
    const saved=store.get('gp-shop-'+user.id);
    CUR=SHOPS.find(s=>s.shop_id===saved)||SHOPS[0];
    await openShop();
  }catch(e){busy(false);showLogin(esc(errMsg(e)))}
}
async function openShop(){
  SHOP=CUR.shop_id;ROLE=CUR.role;ME=CUR.staff_id;store.set('gp-shop-'+USER.id,SHOP);

async function saveFile(filename,data,mime){
  if(DLCAP){try{await DLCAP.save({filename,data});toast('ဖိုင် သိမ်းပြီးပါပြီ');return}catch(e){if(e&&e.code==='declined')return}}
  try{const b=data instanceof Blob?data:new Blob([data],{type:mime||'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
  catch(e){toast('ဖိုင်ထုတ်လို့ မရပါ')}

const promoFor=code=>code?S.promos.find(x=>x.code===String(code).toUpperCase()):null;
function promoValid(p){if(!p||!p.active)return false;const n=Date.now();return(!p.start||new Date(p.start)<=n)&&(!p.end||new Date(p.end)>=n)}
const draft=j=>DRAFT[j.id]||(DRAFT[j.id]={disc:{type:'none',val:0},promo:'',pay:'Cash',splitCash:0,splitOther:'KBZPay'});
function fin(j){
  if(j.status==='paid')return j.total||0;
  const d=draft(j);j.sub=j.lines.reduce((a,l)=>a+l.price*l.qty,0);
  j.discAmt=d.disc.type==='pct'?Math.round(j.sub*Math.min(100,+d.disc.val||0)/100):d.disc.type==='ks'?Math.min(j.sub,+d.disc.val||0):0;
  const p=promoFor(d.promo);j.promoAmt=p&&promoValid(p)?(p.type==='pct'?Math.round((j.sub-j.discAmt)*p.val/100):Math.min(j.sub-j.discAmt,p.val)):0;
  j.total=Math.max(0,j.sub-j.discAmt-j.promoAmt);return j.total}
const lineCost=l=>l.type==='part'?(S.lc[l.id]??0):0;
const jobCost=j=>j.lines.reduce((a,l)=>a+lineCost(l)*l.qty,0);

const PERIODS={today:'ယနေ့','7d':'၇ ရက်',month:'ဒီလ',lastmonth:'ယခင်လ',year:'ဒီနှစ်'};
function range(k){const n=new Date(),s=new Date();s.setHours(0,0,0,0);
  if(k==='today')return[s,n];if(k==='7d'){s.setDate(s.getDate()-6);return[s,n]}if(k==='month'){s.setDate(1);return[s,n]}
  if(k==='lastmonth')return[new Date(s.getFullYear(),s.getMonth()-1,1),new Date(s.getFullYear(),s.getMonth(),1)];return[new Date(s.getFullYear(),0,1),n]}
const inR=(d,[a,b])=>{if(!d)return false;const t=new Date(String(d).length===10?d+'T12:00:00':d);return t>=a&&t<=b};
function buckets(k,[a,b]){
  if(k==='today'){const o=[];for(let h=8;h<=18;h++)o.push({label:h+'',test:d=>sameDay(d,a)&&new Date(d).getHours()===h});return o}
  if(k==='year'){const o=[];for(let m=0;m<=b.getMonth();m++)o.push({label:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m],test:d=>{const x=new Date(d);return x.getFullYear()===a.getFullYear()&&x.getMonth()===m}});return o}
  const o=[];const c=new Date(a);while(c<=b&&!(k==='lastmonth'&&c>=b)){const dd=new Date(c);o.push({label:String(dd.getDate()),test:d=>sameDay(d,dd)});c.setDate(c.getDate()+1)}return o}
function niceMax(v){if(v<=0)return 100000;const e=Math.pow(10,Math.floor(Math.log10(v/4)));for(const m of[1,2,2.5,5,10])if(m*e*4>=v)return m*e*4;return 40*e}
function barChart(pts){
  const W=640,H=260,L=56,R=8,T=26,B=34,max=niceMax(Math.max(...pts.map(p=>p.val),0));
  const cw=(W-L-R)/pts.length,bw=Math.max(3,Math.min(34,cw*.66));const y=v=>T+(H-T-B)*(1-v/max);
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${yy+6}" text-anchor="end">${+(v/100000).toFixed(1)}</text>`}
  const every=Math.ceil(pts.length/12);let bars='';const best=pts.reduce((m,p,i)=>p.val>pts[m].val?i:m,0);
  pts.forEach((p,i)=>{const x=L+cw*i+(cw-bw)/2,yy=y(p.val);bars+=`<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(0,H-B-yy)}" rx="2" fill="${i===best&&p.val>0?'var(--bar2)':'var(--bar)'}"><title>${esc(p.label)}: ${ks(p.val)}</title></rect>`;
    if(i%every===0)bars+=`<text x="${L+cw*i+cw/2}" y="${H-6}" text-anchor="middle">${esc(p.label)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ဝင်ငွေ chart">${g}<text x="4" y="${T-8}" style="font-family:var(--f-body);font-size:16px">သိန်း</text>${bars}</svg></div>`}
function hbars(items,fmt=ks){const mx=Math.max(1,...items.map(i=>i.v));return `<div class="list" style="gap:6px">${items.map(i=>`<div class="hbar"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.k)}</span><span class="tr"><span style="width:${i.v/mx*100}%"></span></span><span class="v">${fmt(i.v)}</span></div>`).join('')||'<div class="empty">ဒေတာ မရှိပါ</div>'}</div>`}
const dueDays=x=>daysTo(x.due_date);
const dueText=x=>{const d=dueDays(x);return d<0?`<span class="pill s-bad">${-d} ရက် ကျော်</span>`:`<span class="pill s-warn">${d} ရက် ကျန်</span>`};

async function shrink(file,max=1280){
  if(!/^image\//.test(file.type))throw new Error('ပုံဖိုင် ရွေးပါ');
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('ပုံ ဖွင့်လို့ မရပါ'));i.src=URL.createObjectURL(file)});
  const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);

function cashDue(j){const d=draft(j);fin(j);return d.pay==='Split'?Math.min(j.total,+d.splitCash||0):d.pay==='Cash'?j.total:0}
function updTotals(j){
  fin(j);const d=draft(j);$('#t-disc').textContent='− '+ks(j.discAmt);$('#r-disc').hidden=!j.discAmt;$('#t-promo').textContent='− '+ks(j.promoAmt);$('#r-promo').hidden=!j.promoAmt;$('#t-total').textContent=ks(j.total);

  const g=$('#given');if(g){const due=cashDue(j);const qc=[due,Math.ceil(due/10000)*10000,Math.ceil(due/50000)*50000,Math.ceil(due/100000)*100000].filter((v,i,a)=>v>0&&a.indexOf(v)===i).slice(0,4);

function bindCheckout(j){
  if(!$('#co'))return;updTotals(j);const d=draft(j);

async function doCheckout(j){
  fin(j);const d=draft(j);const err=m=>{$('#coerr').textContent=m};const c=cust(j.custId);
  if(d.promo){const p=promoFor(d.promo);if(!p||!promoValid(p))return err('Promo Code မှားနေပါတယ် — ဖျက်ပြီး ပြန်စမ်းပါ')}
  let pays;
  if(d.pay==='Split'){const cash=+d.splitCash||0;if(cash<=0||cash>=j.total)return err('ငွေသားပမာဏကို 0 နဲ့ စုစုပေါင်းကြားမှာ ထည့်ပါ');pays=[{method:'Cash',amount:cash},{method:d.splitOther||'KBZPay',amount:j.total-cash}]}
  else if(d.pay==='Prepaid'){if((c.balance||0)<j.total)return err('ကြိုတင်ငွေ မလုံလောက်ပါ — ဖောက်သည်စာမျက်နှာမှာ ငွေဖြည့်ပါ သို့မဟုတ် ခွဲပေးပါ');pays=[{method:'Prepaid',amount:j.total}]}
  else pays=[{method:d.pay,amount:j.total}];
  let given=null;const g=$('#given');if(g&&g.value!==''){given=+g.value;if(given<cashDue(j))return err('ဖောက်သည်ပေးငွေ မလုံလောက်ပါ')}
  await run(async()=>{
    try{await rpc('checkout_job',{p_job:j.id,p_disc_type:d.disc.type,p_disc_val:+d.disc.val||0,p_promo:d.promo||null,p_payments:pays,p_cash_given:given})}catch(e){err(errMsg(e));return}
    delete DRAFT[j.id];

    const tasks=[reloadParts(true)];if(j.custId)tasks.push(reloadCustomer(j.custId));if(d.promo)tasks.push(all('promo_codes').then(r=>S.promos=r.map(mapPromo)));
    await Promise.all(tasks);S.cstats=null;S.closing=null;loadDue().catch(()=>{});
    toast('ငွေရှင်းပြီးပါပြီ');receipt(j.id);
  });
}

function importSheet(){sheet(`${head('<h2>Excel ဖြင့် ပစ္စည်းအများကြီး ထည့်ရန်</h2>')}
  <div class="card"><div class="hint">Column: <b>name, category, cost, price, stock, min</b> — အမည်တူ ရှိပြီးသားဆိုရင် ဈေးနှုန်း ပြင်ပြီး stock ပေါင်းထည့်ပါမယ်။ မရှိသေးတဲ့ Category ကို အလိုအလျောက် ဖန်တီးပါမယ်။</div>
  <div class="btns"><button class="btn" data-a="template">Template ဒေါင်းရန် (.csv)</button></div>
  <label class="f">Excel / CSV ဖိုင် ရွေးရန်<input type="file" id="xfile" class="inp" accept=".xlsx,.xls,.csv"></label><div id="xres" class="hint"></div></div>`);
  $('#xfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||BUSY)return;const out=$('#xres');out.textContent='ဖတ်နေသည်...';busy(true);
    try{const X=await loadXLSX();const wb=X.read(await f.arrayBuffer());const rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      let add=0,upd=0,i=0;const costRole=['owner','manager'].includes(ROLE);
      for(const r of rows){i++;const g=k=>r[k]??r[k.charAt(0).toUpperCase()+k.slice(1)]??'';const name=String(g('name')).trim();if(!name)continue;out.textContent=`${i} / ${rows.length} ...`;
        const cn=String(g('category')).trim();let cat=cn?S.categories.find(c=>c.name===cn):null;
        if(cn&&!cat){const row=await q(sb.from('categories').insert({shop_id:SHOP,name:cn}).select().single());cat={id:row.id,name:row.name};S.categories.push(cat)}
        let p=S.parts.find(x=>x.name.toLowerCase()===name.toLowerCase());const st=+g('stock')||0;
        if(p){const upd2={};if(cat)upd2.category_id=cat.id;if(+g('price'))upd2.price=+g('price');if(g('min')!=='')upd2.min_stock=+g('min');if(Object.keys(upd2).length)await q(sb.from('parts').update(upd2).eq('id',p.id));upd++}
        else{const row=await q(sb.from('parts').insert({shop_id:SHOP,name,category_id:cat?cat.id:null,price:+g('price')||0,min_stock:g('min')===''?3:+g('min')}).select().single());p={id:row.id};add++}
        if(costRole&&+g('cost'))await q(sb.from('part_costs').upsert({part_id:p.id,shop_id:SHOP,cost:+g('cost')},{onConflict:'part_id'}));
        if(st)await rpc('adjust_stock',{p_part:p.id,p_delta:st,p_note:'Excel import'})}
      await reloadParts();logAct('Excel မှ ပစ္စည်း '+add+' မျိုးအသစ်၊ '+upd+' မျိုး ပြင်သည်');out.innerHTML=`<b style="color:var(--ok)">အသစ် ${add} မျိုး၊ ပြင်ဆင် ${upd} မျိုး ထည့်ပြီးပါပြီ</b>`;
    }catch(err){out.textContent='ဖိုင် ဖတ်/သိမ်းလို့ မရပါ — '+errMsg(err)}finally{busy(false)}});
}

function exportSales(){const R=range(period);const rows=[['Job','ငွေရှင်းချိန်','နံပါတ်ပြား','ကား','ဖောက်သည်','ဖုန်း','မက္ကင်းနစ်','ပစ္စည်း/လက်ခ','ကျသင့်ငွေ','လျှော့ဈေး','Promo','စုစုပေါင်း','ပေးချေမှု']];
  paidJobs().filter(j=>inR(j.paidAt,R)).sort((a,b)=>a.paidAt<b.paidAt?-1:1).forEach(j=>{const c=cust(j.custId);rows.push([jl(j),dmy(j.paidAt)+' '+hm(j.paidAt),plateOf(j),modelOf(j),c.name,c.phone,staffName(j.mech),j.lines.map(l=>l.name+(l.qty>1?' x'+l.qty:'')).join('; '),j.sub,j.discAmt||0,j.promoAmt||0,j.total,(j.pays||[]).map(p=>p.m+' '+p.amt).join(' + ')])});
  saveFile('sales-'+period+'-'+dayKey(new Date())+'.csv',csv(rows),'text/csv')}
function exportProfit(){const rows=[['အမည်','အမျိုးအစား','ခု','ရောင်းရငွေ','ဝယ်ဈေး','အမြတ်']];(window.__profitRows||[]).forEach(([k,o])=>rows.push([k,o.t==='svc'?'လက်ခ':'ပစ္စည်း',o.q,o.r,o.c,o.r-o.c]));saveFile('profit-'+profitPeriod+'.csv',csv(rows),'text/csv')}
function exportLogs(){saveFile('activity-log-'+dayKey(new Date())+'.csv',csv([['အချိန်','လုပ်သူ','လုပ်ဆောင်ချက်'],...(S.logs||[]).map(l=>[dmy(l.created_at)+' '+hm(l.created_at),staffName(l.by_staff),l.message])]),'text/csv')}
async function backupXlsx(){try{const X=await loadXLSX();const wb=X.utils.book_new();const add=(n,rows)=>X.utils.book_append_sheet(wb,X.utils.json_to_sheet(rows.length?rows:[{}]),n);
  add('Jobs',S.jobs.map(j=>({Job:jl(j),Status:ST[j.status],In:j.in,Paid:j.paidAt||'',Plate:plateOf(j),Model:modelOf(j),Customer:cust(j.custId).name,Phone:cust(j.custId).phone,Mechanic:staffName(j.mech),Items:j.lines.map(l=>l.name+' x'+l.qty).join('; '),Total:j.status==='paid'?j.total:fin(j),Payment:(j.pays||[]).map(p=>p.m+' '+p.amt).join(' + ')})));
  add('Parts',S.parts.map(p=>({name:p.name,category:p.cat,cost:p.cost??'',price:p.price,stock:p.stock,min:p.min})));
  add('Customers',S.customers.map(c=>({Name:c.name,Phone:c.phone,Prepaid:c.balance,Vehicles:S.vehicles.filter(v=>v.custId===c.id).map(v=>v.plate+' '+v.model).join('; ')})));
  add('Services',S.services.map(s=>({Name:s.name,Price:s.price,Active:s.active})));
  add('Expenses',S.expenses.map(e=>({Date:e.date,Type:e.cat,Amount:e.amt,Note:e.note})));
  const buf=X.write(wb,{type:'array',bookType:'xlsx'});logAct('Excel Backup ထုတ်သည်');saveFile((S.shop.slug||'garage')+'-backup-'+dayKey(new Date())+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}catch(e){toast('Excel ဖန်တီးလို့ မရပါ — JSON ကို သုံးပါ')}}
function backupJson(){const o={exported_at:new Date().toISOString(),shop:S.shop,staff:S.staff,services:S.services,categories:S.categories,parts:S.parts,customers:S.customers,vehicles:S.vehicles,jobs:S.jobs,promos:S.promos,expenses:S.expenses};

    pasusp:()=>{if(t.dataset.v==='1'&&!dbl(t,'ပိတ်မှာ သေချာ?'))return;run(async()=>{await rpc('platform_set_suspended',{p_shop:id,p_suspended:t.dataset.v==='1'});S.pa=null;await refreshMyShops();render()})}};
  if(A[a])A[a]();
});
async function refreshMyShops(){try{SHOPS=await rpc('my_shops')||[];if(SHOP){const c=SHOPS.find(s=>s.shop_id===SHOP);if(c)CUR=c}}catch(e){}}
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,v=id=>($(id)?.value||'').trim();
  const H={
    loginform:()=>run(async()=>{store.set('gp-last-email',v('#le'));const {data,error}=await sb.auth.signInWithPassword({email:v('#le'),password:$('#lp').value});if(error){showLogin(esc(errMsg(error)));return}await afterLogin(data.user)}),
    signupform:()=>run(async()=>{
      const opts=signKind==='shop'?{data:{pending_shop:{name1:v('#sn1'),name2:v('#sn2'),owner:v('#son'),phone:v('#sph')}}}:{};
      opts.emailRedirectTo=location.href.split('#')[0].split('?')[0];
      const {data,error}=await sb.auth.signUp({email:v('#se'),password:$('#sp').value,options:opts});
      if(error){showLogin(esc(errMsg(error)));return}
      store.set('gp-last-email',v('#se'));
      if(data.session){await afterLogin(data.user||data.session.user)}else{authTab='login';showLogin(esc(v('#se'))+' ထဲကို confirm link ပို့ထားပါတယ်။ နှိပ်ပြီးရင် ဒီမှာ Login ဝင်ပါ။','ok')}}),
    newshopform:()=>run(async()=>{await rpc('create_shop',{p_name1:v('#ns1'),p_name2:v('#ns2'),p_owner_name:v('#nso'),p_phone:v('#nsp')});await afterLogin(USER)}),
    pwform:()=>run(async()=>{const {error}=await sb.auth.updateUser({password:$('#npw').value});if(error)throw error;toast('Password ပြောင်းပြီးပါပြီ');close()}),
    jobform:()=>run(async()=>{
      const plateV=v('#jp').toUpperCase().replace(/\s+/g,' ');let vh=S.vehicles.find(x=>plateKey(x.plate)===plateKey(plateV));
      const phone=v('#jt'),name=v('#jc');
      let c=vh?S.customers.find(x=>x.id===vh.custId):null;if(!c&&phone)c=S.customers.find(x=>x.phone.replace(/\D/g,'')===phone.replace(/\D/g,''));
      if(!c){const r=await q(sb.from('customers').insert({shop_id:SHOP,name,phone}).select().single());c=mapCust(r);S.customers.push(c)}
      else if((name&&name!==c.name)||(phone&&phone!==c.phone)){if(can('customers')){await q(sb.from('customers').update({name:name||c.name,phone:phone||c.phone}).eq('id',c.id));c.name=name||c.name;c.phone=phone||c.phone}}
      if(!vh){const r=await q(sb.from('vehicles').insert({shop_id:SHOP,customer_id:c.id,plate:plateV,model:v('#jm'),last_km:+v('#jk')||null}).select().single());vh=mapVeh(r);S.vehicles.push(vh)}
      else if(vh.model!==v('#jm')||vh.custId!==c.id){await q(sb.from('vehicles').update({model:v('#jm'),customer_id:c.id}).eq('id',vh.id));vh.model=v('#jm');vh.custId=c.id}
      const r=await q(sb.from('jobs').insert({shop_id:SHOP,vehicle_id:vh.id,customer_id:c.id,km:+v('#jk')||null,note:v('#jn'),mechanic_id:v('#jmech')||null}).select(JSEL).single());
      const nj=mapJob(r);S.jobs.unshift(nj);
      if(PEND_BK){const bk=(S.bookings||[]).find(b=>b.id===PEND_BK);PEND_BK=null;
        if(bk){await q(sb.from('bookings').update({status:'done',job_id:nj.id}).eq('id',bk.id));bk.status='done';bk.job_id=nj.id;
          for(const nm of String(bk.services||'').split(/,\s*/)){const sv=S.services.find(x=>x.active&&x.name===nm.trim());if(sv){const l=await q(sb.from('job_lines').insert({shop_id:SHOP,job_id:nj.id,kind:'svc',service_id:sv.id,name:sv.name,price:sv.price,qty:1}).select().single());nj.lines.push({id:l.id,type:'svc',ref:sv.id,name:sv.name,price:sv.price,qty:1})}}}}logAct(jl(nj)+' ဖွင့်သည် ('+vh.plate+')');toast('Job ဖွင့်ပြီးပါပြီ');openJob(nj.id)}),
    partform:()=>run(async()=>{const id=f.dataset.id;const d={name:v('#pn'),category_id:v('#pcat')||null,price:+v('#pp')||0,min_stock:+v('#pmin')||0,fav:$('#pfav').checked};const stock=+v('#ps')||0;
      let pid=id;
      if(id){await q(sb.from('parts').update(d).eq('id',id))}else{const r=await q(sb.from('parts').insert({shop_id:SHOP,...d}).select().single());pid=r.id}
      if($('#pcost')&&v('#pcost')!=='')await q(sb.from('part_costs').upsert({part_id:pid,shop_id:SHOP,cost:+v('#pcost')},{onConflict:'part_id'}));
      const old=id?part(id).stock:0;if(stock!==old)await rpc('adjust_stock',{p_part:pid,p_delta:stock-old,p_note:id?'ပြင်ဆင်':'ပစ္စည်းအသစ်'});
      await reloadParts();logAct((id?'ပစ္စည်း ပြင်သည်: ':'ပစ္စည်းအသစ် ထည့်သည်: ')+d.name);toast('သိမ်းပြီးပါပြီ');close()}),
    catform:()=>run(async()=>{const n=v('#catn');if(!n||S.categories.some(c=>c.name===n))return catsSheet();const r=await q(sb.from('categories').insert({shop_id:SHOP,name:n}).select().single());S.categories.push({id:r.id,name:r.name});logAct('Category “'+n+'” ထည့်သည်');catsSheet()}),
    custform:()=>run(async()=>{const c=S.customers.find(x=>x.id===f.dataset.id);await q(sb.from('customers').update({name:v('#cn'),phone:v('#cp')}).eq('id',c.id));c.name=v('#cn');c.phone=v('#cp');logAct('ဖောက်သည် '+c.name+' ပြင်သည်');toast('သိမ်းပြီး')}),
    topform:()=>run(async()=>{const c=S.customers.find(x=>x.id===f.dataset.id);const amt=+v('#ta');c.balance=await rpc('topup_customer',{p_customer:c.id,p_amount:amt,p_method:v('#tm')});S.topups.unshift({t:new Date().toISOString(),custId:c.id,amt,m:v('#tm')});S.closing=null;toast('ငွေဖြည့်ပြီးပါပြီ');custSheet(c.id)}),
    ncform:()=>run(async()=>{const r=await q(sb.from('customers').insert({shop_id:SHOP,name:v('#ncn'),phone:v('#ncp')}).select().single());const c=mapCust(r);S.customers.push(c);
      if(v('#ncv')){const vr=await q(sb.from('vehicles').insert({shop_id:SHOP,customer_id:c.id,plate:v('#ncv').toUpperCase(),model:v('#ncm')}).select().single());S.vehicles.push(mapVeh(vr))}
      logAct('ဖောက်သည်အသစ် '+c.name+' ထည့်သည်');S.cstats=null;custSheet(c.id)}),
    exform:()=>run(async()=>{const r=await q(sb.from('expenses').insert({shop_id:SHOP,spent_on:v('#exd')||dayKey(new Date()),category:v('#exc'),amount:+v('#exa'),note:v('#exn'),by_staff:ME}).select().single());
      S.expenses.push({id:r.id,date:r.spent_on,cat:r.category,amt:r.amount,note:r.note||''});logAct('စရိတ် '+r.category+' '+ks(r.amount)+' ထည့်သည်');toast('စရိတ် ထည့်ပြီး');render()}),
    closeform:()=>run(async()=>{const exp=+$('#cdiff').dataset.exp,cnt=+v('#counted');await q(sb.from('cash_closings').upsert({shop_id:SHOP,close_date:dayKey(new Date()),expected:exp,counted:cnt,by_staff:ME},{onConflict:'shop_id,close_date'}));
      logAct('ငွေစာရင်းပိတ်သည် (ကွာ '+ks(cnt-exp)+')');S.closing=null;S.closingToday=dayKey(new Date());toast('ယနေ့ စာရင်းပိတ်ပြီးပါပြီ');render()}),
    promoform:()=>run(async()=>{const code=v('#pc').toUpperCase().replace(/\s/g,'');const days=+v('#pd');
      const r=await q(sb.from('promo_codes').insert({shop_id:SHOP,code,kind:v('#pt'),value:+v('#pv'),starts_at:new Date().toISOString(),ends_at:days?new Date(Date.now()+days*864e5).toISOString():null}).select().single());
      S.promos.unshift(mapPromo(r));logAct('Promo '+code+' ဖန်တီးသည်');toast('Code သိမ်းပြီး');render()}),
    staffform:()=>run(async()=>{const r=await q(sb.from('shop_staff').insert({shop_id:SHOP,name:v('#sn'),phone:v('#sp2'),email:v('#sem').toLowerCase()||null,role:v('#sr')}).select().single());
      S.staff.push(mapStaff(r));logAct('ဝန်ထမ်း '+r.name+' ('+ROLES[r.role].n+') ထည့်သည်');toast('ထည့်ပြီး');render()}),
    setform:()=>run(async()=>{
      const d={name1:v('#s1'),name2:v('#s2'),address:v('#s3'),phone:v('#s4'),receipt_footer:v('#s5'),oil_km:+v('#s6')||5000,oil_months:+v('#s7')||3,brand_bg:v('#s8'),brand_fg:v('#s9'),is_public:$('#spub').checked,viber:v('#sviber'),facebook:v('#sfb'),about:v('#sabout'),hours:v('#shours'),map_url:v('#smap')};
      const r=await q(sb.from('shops').update(d).eq('id',SHOP).select().single());S.shop=r;CUR.name1=r.name1;CUR.name2=r.name2;logAct('ဆိုင်အချက်အလက် ပြင်သည်');toast('သိမ်းပြီးပါပြီ');render()}),
    bkform:()=>run(async()=>{const r=await rpc('create_booking',{p_name:v('#bkn'),p_phone:v('#bkp'),p_plate:v('#bkpl'),p_model:v('#bkm'),p_services:v('#bks'),p_date:v('#bkd'),p_slot:v('#bkt'),p_note:v('#bkno')});
      await q(sb.from('bookings').update({status:'confirmed'}).eq('id',r.id));logAct('Booking #'+r.no+' ထည့်သည် (ဖုန်း)');await loadBookings();toast('Booking ထည့်ပြီး');close()}),
    chatform:()=>run(async()=>{const body=v('#chattxt');if(!body)return;await q(sb.from('chat_messages').insert({shop_id:SHOP,customer_id:f.dataset.id,sender:'shop',staff_id:ME,body}));$('#chattxt').value='';threadSheet(f.dataset.id)}),
    bnform:()=>run(async()=>{const fl=$('#bni').files[0];const image_url=fl?await uploadImage(fl):null;await q(sb.from('banners').insert({shop_id:SHOP,title:v('#bnt'),subtitle:v('#bns'),link:v('#bnl'),image_url,sort:Date.now()%100000}));logAct('Banner တင်သည်: '+v('#bnt'));toast('Banner တင်ပြီး');render()}),
    psform:()=>run(async()=>{const fl=$('#psi').files[0];const image_url=fl?await uploadImage(fl):null;await q(sb.from('posts').insert({shop_id:SHOP,title:v('#pst'),body:$('#psb').value.trim(),image_url}));logAct('Post တင်သည်: '+v('#pst'));toast('Post တင်ပြီး');render()}),
    bksetform:()=>run(async()=>{const slots=v('#bkslots').split(',').map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,'0'));if(!slots.length){toast('အချိန်ကို 09:00 ပုံစံနဲ့ ထည့်ပါ');return}
      const closed=[...document.querySelectorAll('input[name="cd"]:checked')].map(x=>x.value).join(',');
      const r=await q(sb.from('shops').update({booking_slots:slots.join(','),slot_capacity:Math.max(1,+v('#bkcap')||1),booking_days:Math.max(1,+v('#bkdays')||14),closed_days:closed}).eq('id',SHOP).select().single());S.shop=r;logAct('Booking setting ပြင်သည်');toast('သိမ်းပြီးပါပြီ');render()}),
    svcform:()=>run(async()=>{const r=await q(sb.from('services').insert({shop_id:SHOP,name:v('#nsn'),price:+v('#nsp'),sort:S.services.length+1}).select().single());S.services.push(mapSvc(r));logAct('လက်ခ “'+r.name+'” ထည့်သည်');render()})};
  if(H[f.id])H[f.id]();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)close()});
boot();
