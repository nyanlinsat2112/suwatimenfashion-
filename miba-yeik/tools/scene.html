<canvas id="c" width="1280" height="720"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1280,H=720,T=10,TAU=Math.PI*2;
const C={bg:'#7bb5cc',wall:'#86bdd2',floor:'#5f9cb3',floorTop:'#9ccbdc',dark:'#1f3d47',dark2:'#2c5866',tyre:'#16303a',rim:'#cfe0e6',glass:'#b4d8e5',orange:'#d9772b',orange2:'#f3a35c'};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const dust=[...Array(40)].map(()=>({x:250+rnd()*800,y:rnd(),r:.8+rnd()*1.8,a:.15+rnd()*.3,k:1+Math.floor(rnd()*2),ph:rnd()}));
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function spring(cx,top,bot,glow){ // coil spring + shock absorber (x-ray)
  x.save();x.lineCap='round';
  x.strokeStyle=glow?C.orange:'#5a8a99';x.lineWidth=glow?5:4;
  x.beginPath();x.moveTo(cx,top);x.lineTo(cx,bot);x.stroke(); // shock rod
  x.lineWidth=glow?4:3;x.beginPath();const n=6,hgt=bot-top-14;
  for(let i=0;i<=n*16;i++){const t=i/(n*16);const yy=top+8+t*hgt;const xx=cx+Math.sin(t*n*TAU)*16;i?x.lineTo(xx,yy):x.moveTo(xx,yy)}
  x.strokeStyle=glow?C.orange2:'#6f9cab';x.stroke();x.restore();
}
function wheel(cx,cy,ang){
  x.fillStyle=C.tyre;x.beginPath();x.arc(cx,cy,58,0,TAU);x.fill();
  x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=2;for(let r=46;r<57;r+=5){x.beginPath();x.arc(cx,cy,r,0,TAU);x.stroke()}
  x.fillStyle='#8fa9b2';x.beginPath();x.arc(cx,cy,37,0,TAU);x.fill(); // brake disc
  x.save();x.translate(cx,cy);x.fillStyle=C.orange;x.rotate(-2.3);rr(-9,-36,18,26,6);x.fill();x.restore(); // caliper
  x.save();x.translate(cx,cy);x.rotate(ang);x.fillStyle=C.rim;
  for(let i=0;i<5;i++){x.save();x.rotate(i*TAU/5);rr(-5.5,-36,11,30,5);x.fill();x.restore()}
  x.beginPath();x.arc(0,0,36,0,TAU);x.lineWidth=5;x.strokeStyle=C.rim;x.stroke();
  x.fillStyle='#e9f2f5';x.beginPath();x.arc(0,0,10,0,TAU);x.fill();
  x.fillStyle=C.dark2;for(let i=0;i<5;i++){const a=i*TAU/5;x.beginPath();x.arc(Math.cos(a)*6,Math.sin(a)*6,1.6,0,TAU);x.fill()}
  x.restore();
}
function draw(t){
  const p=t/T, lift=Math.sin(p*TAU)*6, beam=400+500*(.5-.5*Math.cos(p*TAU)), ang=p*TAU*2;
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  const K=.62,FY=670;
  x.fillStyle=C.floor;x.fillRect(0,FY,W,H-FY);x.fillStyle=C.floorTop;x.fillRect(0,FY-2,W,3);
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;for(let i=-4;i<30;i++){x.beginPath();x.moveTo(i*60,720);x.lineTo(i*60+30,FY+1);x.stroke()}
  x.save();x.translate(640,FY);x.scale(K,K);x.translate(-640,-640);
  // back wall hints
  x.fillStyle=C.wall;rr(60,300,1160,340,18);x.fill();
  x.fillStyle='rgba(31,61,71,.07)';for(let i=0;i<22;i++)for(let j=0;j<6;j++){x.beginPath();x.arc(110+i*50,340+j*40,2.5,0,TAU);x.fill()}
  // tools on pegboard
  x.strokeStyle='rgba(31,61,71,.18)';x.lineWidth=6;x.lineCap='round';
  [[150,350,60],[185,345,75],[220,352,55],[1080,350,70],[1115,345,60],[1150,352,80]].forEach(([a,b,l])=>{x.beginPath();x.moveTo(a,b);x.lineTo(a,b+l);x.stroke()});
  // floor
  // tyre stack (left) & tool cabinet (right)
  for(let i=0;i<3;i++){x.fillStyle=C.tyre;rr(80,600-i*34,120,32,14);x.fill();x.fillStyle='rgba(255,255,255,.08)';rr(92,610-i*34,96,6,3);x.fill()}
  x.fillStyle=C.dark2;rr(1060,520,130,120,10);x.fill();
  x.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<4;i++){rr(1070,530+i*27,110,20,4);x.fill()}
  x.fillStyle=C.orange;for(let i=0;i<4;i++){rr(1112,538+i*27,26,4,2);x.fill()}
  // shadow
  const g=x.createRadialGradient(640,645,10,640,645,380);g.addColorStop(0,'rgba(20,45,55,.35)');g.addColorStop(1,'rgba(20,45,55,0)');
  x.fillStyle=g;x.beginPath();x.ellipse(640,645,380,16,0,0,TAU);x.fill();
  // lift posts
  [[285],[969]].forEach(([px])=>{x.fillStyle=C.dark2;rr(px,330,26,312,6);x.fill();x.fillStyle=C.dark;rr(px-14,630,54,12,4);x.fill();
    x.fillStyle=C.dark;rr(px+(px<640?20:-68),520+lift,74,10,4);x.fill(); // arm
    const on=(Math.sin(p*TAU*5)>0);x.fillStyle=on?C.orange2:'rgba(217,119,43,.35)';x.beginPath();x.arc(px+13,350,5,0,TAU);x.fill()});
  x.save();x.translate(0,lift);
  // underbody (x-ray parts)
  const glow=xx=>Math.abs(xx-beam)<70;
  x.fillStyle='rgba(31,61,71,.85)';rr(360,500,580,20,8);x.fill(); // floor pan
  x.lineCap='round';
  const part=(x1,y1,x2,y2,w)=>{const gl=glow((x1+x2)/2);x.strokeStyle=gl?C.orange:'#3c6b7a';x.lineWidth=w;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()};
  part(452,548,560,522,9);   // front lower arm
  part(828,548,720,522,9);   // rear trailing arm (car faces left? we face right) 
  part(470,527,620,522,6);   // drive shaft
  part(600,523,900,523,5);   // exhaust
  {const gl=glow(760);x.fillStyle=gl?C.orange:'#3c6b7a';rr(730,514,70,20,8);x.fill()} // muffler
  {const gl=glow(640);x.fillStyle=gl?'rgba(217,119,43,.9)':'#335f6d';rr(600,512,90,16,6);x.fill()} // tank
  // body
  x.fillStyle=C.dark;x.beginPath();
  x.moveTo(345,505);x.lineTo(338,470);x.lineTo(342,372);x.quadraticCurveTo(346,338,372,334);x.lineTo(712,330);
  x.quadraticCurveTo(730,331,742,342);x.lineTo(808,402);x.lineTo(918,414);x.quadraticCurveTo(944,420,947,446);x.lineTo(950,488);x.quadraticCurveTo(948,505,930,506);x.closePath();x.fill();
  // arches
  x.fillStyle='#14303a';[440,840].forEach(w=>{x.beginPath();x.arc(w,520,68,Math.PI,0);x.fill()});
  // glass
  x.fillStyle=C.glass;x.beginPath();x.moveTo(372,352);x.lineTo(706,348);x.quadraticCurveTo(718,349,726,357);x.lineTo(780,404);x.lineTo(372,404);x.closePath();x.fill();
  x.fillStyle=C.dark;[[495,8],[615,9],[700,7]].forEach(([px,w])=>{x.fillRect(px,346,w,60)});
  x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.moveTo(390,356);x.lineTo(450,356);x.lineTo(420,400);x.lineTo(380,400);x.fill();
  // lines & lights
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;[[500,410,500,495],[620,410,620,495]].forEach(([a,b,c2,d])=>{x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke()});
  x.beginPath();x.moveTo(350,450);x.lineTo(945,452);x.stroke();
  x.fillStyle='#f4e7c9';rr(918,424,24,12,5);x.fill();x.fillStyle=C.orange;rr(338,382,10,34,4);x.fill();
  x.fillStyle='rgba(255,255,255,.25)';rr(540,428,26,5,2);x.fill();rr(660,428,26,5,2);x.fill();
  // springs (x-ray, over arches)
  spring(440,452,540,glow(440));spring(840,452,540,glow(840));
  wheel(440,548,ang);wheel(840,548,ang+.7);
  x.restore();
  // scan beam
  const bg=x.createLinearGradient(beam-90,0,beam+90,0);bg.addColorStop(0,'rgba(255,243,226,0)');bg.addColorStop(.5,'rgba(255,243,226,.22)');bg.addColorStop(1,'rgba(255,243,226,0)');
  x.fillStyle=bg;x.beginPath();x.moveTo(beam-30,520+lift);x.lineTo(beam+30,520+lift);x.lineTo(beam+90,640);x.lineTo(beam-90,640);x.fill();
  x.fillStyle='rgba(255,243,226,.5)';x.beginPath();x.ellipse(beam,640,80,4,0,0,TAU);x.fill();
  // dust
  dust.forEach(d=>{const yy=640-((d.y+p*d.k+d.ph)%1)*330;const near=Math.max(0,1-Math.abs(d.x-beam)/160);
    x.fillStyle=`rgba(255,255,255,${d.a*(.35+near)})`;x.beginPath();x.arc(d.x+Math.sin((p*d.k+d.ph)*TAU)*8,yy,d.r,0,TAU);x.fill()});
  x.restore();
}
window.draw=draw;draw(0);
</script>
